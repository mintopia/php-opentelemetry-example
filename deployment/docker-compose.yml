services:
    telemetry:
        image: ghcr.io/mintopia/php-opentelemetry-example:latest
        restart: unless-stopped
        depends_on:
            - redis
        env_file: .env.telemetry
        ports:
            - 8000:8000

    scheduler:
        image: ghcr.io/mintopia/php-opentelemetry-example:latest
        restart: unless-stopped
        depends_on:
            - redis
        env_file: .env.telemetry
        entrypoint: [ "php", "artisan", "schedule:work" ]
        healthcheck:
            disable: true

    redis:
        image: redis:6.2.6
        restart: unless-stopped

    collector:
        image: public.ecr.aws/aws-observability/aws-otel-collector:latest
        volumes:
            - ./otel-collector-config.yaml:/etc/otel-agent-config.yaml
        restart: unless-stopped
        env_file: .env.collector
        command: ["--config=/etc/otel-agent-config.yaml"]
